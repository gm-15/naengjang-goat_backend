#########################################
# SPRING BATCH
#########################################
# MySQL 환경에서 BATCH_JOB_INSTANCE 등 메타 테이블 자동 생성.
# 기본값 'embedded'는 H2 전용이므로 MySQL에서 명시 필요.
# 테이블이 이미 존재하면 스킵 — 중복 생성 없음.
spring.batch.jdbc.initialize-schema=always

#########################################
# FLYWAY MIGRATION
#########################################
# Flyway 가 먼저 돌고 그다음 Hibernate ddl-auto=update 가 엔티티에만 있는 컬럼·테이블을 채운다.
# price_records.unit_price_per_kg(GENERATED STORED)는 V002 로만 생긴다. Flyway 를 끄고 새 DB 를 만들면
#   JPA 가 일반 컬럼으로 만들어 값이 항상 NULL 이 되므로 끄지 말 것.
# out-of-order: V001~V008 이 이미 적용된 DB 에도 뒤늦게 추가한 V0_1 을 적용하기 위함 (IF NOT EXISTS 라 변경 없음).
# baseline 은 쓰지 않는다. 이력 없이 JPA 로만 만든 DB 는 V001~V008 을 건너뛰게 되므로, 기동 실패로 드러나게 두고 DB 를 새로 만든다.
# park, 2026-09-17 (이전: sim, 2026-06-01 — 기본 off + baseline-version=8)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.out-of-order=true

