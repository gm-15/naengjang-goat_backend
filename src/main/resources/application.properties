# Flyway 가 먼저 돌고 그다음 Hibernate ddl-auto 가 엔티티에만 있는 컬럼을 채운다.
# 끄면 안 되는 이유 (park, 2026-10-31):
#   - 새 DB 에서 V009~V011 이 적용되지 않는다 → POS 업로드·입고·마감 알림 테이블과 가격 관측 유일 인덱스가 빠진다
#   - price_records.unit_price_per_kg(GENERATED STORED)는 V002 로만 생긴다. 끄면 JPA 가 일반 컬럼으로 만들어 값이 항상 NULL 이 된다
#   - 빈 DB 는 beforeMigrate 콜백이 기반 테이블을 먼저 만들어 주므로 V001 부터 끝까지 적용된다 (2026-10-18 확인)
# 이미 ddl-auto 로 V009~V011 대상 컬럼·테이블이 만들어진 DB 는 적용이 실패할 수 있다.
#   그런 DB 는 SPRING_FLYWAY_ENABLED=false 로 임시 우회하거나 DB 를 새로 만든다. baseline 으로 건너뛰면 위 두 문제가 조용히 남는다.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

