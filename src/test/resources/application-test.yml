    key: dummy
    id: dummy
    return-type: xml
    action:
      daily: dailyPriceByCategoryList

# 카오스 테스트에서 Circuit Breaker가 빠르게 열리도록 오버라이드
# 3회 호출 중 2회 실패 시 (≥50%) OPEN 상태로 전환
resilience4j:
  circuitbreaker:
    instances:
      redisLock:
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 1

# Tests require a dedicated database because the legacy stress fixtures clear tables.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/naengjang_goat_test?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
  jpa:
    show-sql: false
